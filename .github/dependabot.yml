# Dependabot version updates. Security updates are grouped separately and are not delayed by cooldown.
# https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/optimizing-pr-creation-version-updates#setting-up-a-cooldown-period-for-dependency-updates

version: 2

updates:
  # GitHub Actions - weekly checks, 7-day cooldown before opening version-update PRs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  # npm/pnpm (package.json + pnpm-lock.yaml at repo root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
