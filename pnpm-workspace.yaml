# savePrefix: exact versions for future pnpm add/install changes.
# minimumReleaseAge: wait 1 day before accepting newly published packages.
# blockExoticSubdeps: no git/tarball transitive deps.
savePrefix: ''
blockExoticSubdeps: true
minimumReleaseAge: 1440 # 1 day in minutes
minimumReleaseAgeStrict: true

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

overrides:
  sharp: 0.35.3
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@<3.3.18': 3.3.18
